name: iOS TestFlight

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Deploy iOS to TestFlight
    runs-on: macos-latest

    defaults:
      run:
        working-directory: my_app

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 3. Get Flutter dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------
      # 4. Check Flutter installation
      # --------------------------------------------------
      - name: Flutter doctor
        run: flutter doctor -v

      # --------------------------------------------------
      # 5. Install CocoaPods dependencies
      # --------------------------------------------------
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      # --------------------------------------------------
      # 6. Build iOS IPA
      # --------------------------------------------------
      - name: Build iOS IPA
        run: flutter build ipa --release

      # --------------------------------------------------
      # 7. Install Fastlane
      # --------------------------------------------------
      - name: Install Fastlane
        run: gem install fastlane

      # --------------------------------------------------
      # 8. Upload IPA to TestFlight
      # --------------------------------------------------
      - name: Upload to TestFlight
        working-directory: my_app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p fastlane/private_keys

          echo "$APP_STORE_CONNECT_API_KEY" \
            | base64 --decode \
            > fastlane/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          fastlane pilot upload \
            --ipa build/ios/ipa/*.ipa \
            --api_key_path <(
              cat <<EOF
          {
            "key_id": "$APP_STORE_CONNECT_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key": "$(cat fastlane/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 | base64 | tr -d '\n')",
            "in_house": false
          }
          EOF
          )
