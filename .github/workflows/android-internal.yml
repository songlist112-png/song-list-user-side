name: Android Internal Testing

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-android:
    name: Build and Deploy Android Internal Testing
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my_app

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Get dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------
      # 5. Decode Android signing key
      # --------------------------------------------------
      - name: Setup Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      # --------------------------------------------------
      # 6. Create key.properties
      # --------------------------------------------------
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # --------------------------------------------------
      # 7. Build Android App Bundle
      # --------------------------------------------------
      - name: Build AAB
        run: flutter build appbundle --release

      # --------------------------------------------------
      # 8. Setup Google Play service account
      # --------------------------------------------------
      - name: Setup Google Play credentials
        env:
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_JSON" > google-play-service-account.json

      # --------------------------------------------------
      # 9. Install Fastlane
      # --------------------------------------------------
      - name: Install Fastlane
        run: gem install fastlane

      # --------------------------------------------------
      # 10. Upload to Google Play Internal Testing
      # --------------------------------------------------
      - name: Upload to Google Play
        working-directory: my_app
        env:
          GOOGLE_PLAY_JSON: ${{ github.workspace }}/google-play-service-account.json
        run: |
          fastlane supply \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track internal \
            --json_key "$GOOGLE_PLAY_JSON" \
            --package_name "com.example.myapp"
